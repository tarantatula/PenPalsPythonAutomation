[tox]
envlist = test-ui, test-api

[testenv]
deps =
    pytest
    selenium
    requests
    pytest-html
    pytest-cov
commands = pytest --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

[testenv:test-ui]
deps = {[testenv]deps}
commands = pytest -m ui --html=reports/ui-report.html --self-contained-html --junitxml=reports/ui-junit.xml

[testenv:test-api]
deps = {[testenv]deps}
commands = pytest -m api --html=reports/api-report.html --self-contained-html --junitxml=reports/api-junit.xml

[flake8]
max-line-length = 88